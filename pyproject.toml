[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkit"
version = "0.1.0"
description = "Lint, evaluate, build and deploy Genie Code context (skills, workspace instructions, AGENTS.md)"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40"]
dev = ["pytest>=8", "databricks-sdk>=0.40"]

[project.scripts]
skillkit = "skillkit.cli:main"

[tool.setuptools]
packages = ["skillkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
