[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkit"
version = "0.1.0"
description = "Checks for the context-authoring meta-skill (lint, names, evals), plus optional build/deploy/freshness"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.40"]
dev = ["pytest>=8", "databricks-sdk>=0.40"]

[project.scripts]
skillkit = "skillkit.cli:main"
skillkit-ops = "skillkit_ops.cli:main"

# skillkit ships inside the meta-skill (context-authoring/scripts/); skillkit_ops is the optional ops layer.
[tool.setuptools]
packages = ["skillkit", "skillkit_ops"]

[tool.setuptools.package-dir]
skillkit = "context-authoring/scripts/skillkit"
skillkit_ops = "ops/skillkit_ops"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["context-authoring/scripts", "ops", "tests"]
