# PR validation for genie-context.
# Azure Repos ignores `pr:` triggers in YAML: add this pipeline as a Build validation
# policy on main (Branch policies > Build validation), required.

trigger: none

resources:
  repositories:
    - repository: source_repo          # source repo, checked out for AGENTS.md context in evals
      type: git
      name: <project>/data-platform   # TODO: <project>/<repo>
      ref: refs/heads/main

variables:
  - group: genie-context-dev     # DATABRICKS_HOST, ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID
  # advisory: eval failures are reported as warnings (pilot phase, as PayPal started);
  # blocking: a FAILING or NO EFFECT verdict fails the PR.
  - name: EVAL_GATE
    value: advisory

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    path: s/genie-context
  - checkout: source_repo
    path: s/repos/data-platform

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"

  - script: pip install -e ".[dev]"
    displayName: Install skillkit
    workingDirectory: $(Pipeline.Workspace)/s/genie-context

  - script: pytest -q
    displayName: Unit tests
    workingDirectory: $(Pipeline.Workspace)/s/genie-context

  - script: skillkit lint
    displayName: Lint skills, catalog budget, workspace instructions
    workingDirectory: $(Pipeline.Workspace)/s/genie-context

  - script: |
      CHANGED=$(skillkit changed --base origin/$(System.PullRequest.TargetBranchName))
      echo "Changed skills: ${CHANGED:-none}"
      echo "##vso[task.setvariable variable=CHANGED_SKILLS]$CHANGED"
    displayName: Find changed skills
    workingDirectory: $(Pipeline.Workspace)/s/genie-context

  - script: |
      skillkit eval $(CHANGED_SKILLS) \
        --repos-root $(Pipeline.Workspace)/s/repos \
        --runs 3 --require-value \
        --out $(Build.ArtifactStagingDirectory)/eval-report.md \
        --json $(Build.ArtifactStagingDirectory)/eval-results.json \
      || { if [ "$(EVAL_GATE)" = "blocking" ]; then exit 1; else echo "##vso[task.logissue type=warning]Evals failed (advisory mode)"; fi; }
    displayName: Evals with baseline (changed skills, 3 runs)
    condition: and(succeeded(), ne(variables['CHANGED_SKILLS'], ''))
    workingDirectory: $(Pipeline.Workspace)/s/genie-context
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: |
      skillkit eval --mode routing --runs 3 \
        --out $(Build.ArtifactStagingDirectory)/routing-all.md \
      || { if [ "$(EVAL_GATE)" = "blocking" ]; then exit 1; else echo "##vso[task.logissue type=warning]Routing regression in other skills (advisory mode)"; fi; }
      cat $(Build.ArtifactStagingDirectory)/routing-all.md >> $(Build.ArtifactStagingDirectory)/eval-report.md
    displayName: Coexistence - routing for all active skills
    condition: and(succeeded(), ne(variables['CHANGED_SKILLS'], ''))
    workingDirectory: $(Pipeline.Workspace)/s/genie-context
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  - script: python pipelines/scripts/post_pr_comment.py $(Build.ArtifactStagingDirectory)/eval-report.md
    displayName: Post eval report on the PR
    condition: and(always(), ne(variables['CHANGED_SKILLS'], ''))
    workingDirectory: $(Pipeline.Workspace)/s/genie-context
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: eval
    condition: always()
