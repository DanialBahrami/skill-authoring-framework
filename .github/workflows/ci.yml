# CI for this framework repo: unit tests and lint of the example output folder.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: skillkit --root examples/output lint
      - run: skillkit --root examples/output lint-agents examples/data-platform/AGENTS.md
      - run: skillkit-ops --help
