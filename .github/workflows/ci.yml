# CI for this framework repo: unit tests (including a dry run of the installed skill) and template lint.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: skillkit lint-agents context-authoring/assets/templates/AGENTS.repo.md context-authoring/assets/templates/AGENTS.team.md
      - run: skillkit-ops --help
